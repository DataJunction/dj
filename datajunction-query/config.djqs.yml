engines:
  - name: duckdb
    version: 0.7.1
    type: duckdb
    uri: duckdb:////code/docker/default.duckdb
    extra_params:
      location: /code/docker/default.duckdb
  - name: trino
    version: 451
    type: sqlalchemy
    uri: trino://trino-coordinator:8080/tpch/sf1
    extra_params:
      http_scheme: http
      user: admin
  - name: dj_system
    version: ''
    type: sqlalchemy
    uri: postgresql+psycopg://readonly_user:readonly_pass@postgres_metadata:5432/dj
  - name: sales_pg
    version: ''
    type: sqlalchemy
    uri: postgresql+psycopg://readonly_user:readonly_pass@postgres_metadata:5432/sales_demo
  # - name: bigquery
  #   version: ''
  #   type: bigquery
  #   uri: bigquery:///
  #   extra_params:
  #     project: <your-gcp-project>
catalogs:
  - name: warehouse
    engines:
      - duckdb
  - name: tpch
    engines:
      - trino
  - name: dj
    engines:
      - dj_system
  - name: sales
    engines:
      - sales_pg
