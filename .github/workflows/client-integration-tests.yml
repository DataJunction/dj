name: "Client integration tests"
on:
  schedule:
    - cron:  '0 12 * * *'
  workflow_dispatch:
  # Not scoped to datajunction-server/** — that would fire on nearly every PR.
  # Server changes that break a client are caught by the nightly run.
  pull_request:
    paths:
      - 'datajunction-clients/**'
      - 'docker-compose.yml'
      - '.github/workflows/client-integration-tests.yml'
jobs:
  python-client-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Build and launch DJ demo environment
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./docker-compose.yml"
          services: |
            dj
            postgres_metadata
            db-migration
            db-seed
            djqs
            djqs-db-migration
            djrs-redis
            djrs-worker
            djrs-beat
            dj-trino
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: |
          cd ./datajunction-clients/python
          uv sync --group test --extra mcp --python ${{ matrix.python-version }}
      - name: Python client integration tests
        run: cd datajunction-clients/python && make test PYTEST_ARGS="--integration -k test_integration"

  javascript-client-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
      - name: Build and launch DJ demo environment
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./docker-compose.yml"
          services: |
            dj
            postgres_metadata
            db-migration
            db-seed
            djqs
            djqs-db-migration
            djrs-redis
            djrs-worker
            djrs-beat
            dj-trino
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dev Dependencies
        run: npm install --only=dev
        working-directory: ./datajunction-clients/javascript
      - name: Javascript client integration tests
        run: npm test
        working-directory: ./datajunction-clients/javascript

  java-client-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 17 ]
        distribution: [ 'temurin' ]
    steps:
      - uses: actions/checkout@v4
      - name: Build and launch DJ demo environment
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "./docker-compose.yml"
          services: |
            dj
            postgres_metadata
            db-migration
            db-seed
            djqs
            djqs-db-migration
            djrs-redis
            djrs-worker
            djrs-beat
            dj-trino
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}
      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: cleanTest test
          build-root-directory: ./datajunction-clients/java

