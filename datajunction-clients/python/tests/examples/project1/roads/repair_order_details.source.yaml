description: This is a source for details on individual repair orders
table: default.roads.repair_order_details
columns:
  - name: repair_order_id
    type: int
  - name: repair_type_id
    type: int
  - name: price
    type: float
  - name: quantity
    type: int
  - name: discount
    type: float
dimension_links:
  - type: join
    dimension_node: ${prefix}roads.repair_order
    join_on: ${prefix}roads.repair_order_details.repair_order_id = ${prefix}roads.repair_order.repair_order_id
display_name: default.roads.repair_order_details
